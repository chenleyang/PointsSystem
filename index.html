<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#175cff"><title>藝速科技积分系统</title><link rel="stylesheet" href="./style.css"></head>
<body>
<section id="login-screen" class="login-screen" aria-label="系统登录"><form id="login-form" class="login-card"><img class="login-logo" src="./logoPng.png" alt="藝速科技 Logo"><h1>藝速科技积分系统</h1><p>请输入管理员账号登录</p><label>账号<input name="username" type="text" autocomplete="username" required autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><div id="login-error" class="login-error" role="alert"></div><button class="button primary" type="submit">登录</button></form></section>
<header class="topbar"><a class="brand" href="#customers"><img class="brand-logo" src="./logoPng.png" alt="系统 Logo"><span id="brand-title">藝速科技积分系统</span></a><div class="topbar-right"><span class="local-indicator">本地数据模式</span><span class="admin-avatar">管</span><span>管理员</span></div></header>
<aside class="sidebar"><div class="nav-caption">工作空间</div><nav id="nav"></nav><div class="sidebar-bottom"><span class="status-dot"></span> 浏览器本地存储<small>建议定期导出数据备份</small></div></aside>
<main id="main"></main><div id="toast" role="status" aria-live="polite"></div>
<dialog id="modal"><form id="modal-form"><div class="modal-header"><h2 id="modal-title"></h2><button type="button" class="icon-button" id="close-modal" aria-label="关闭">×</button></div><div id="modal-body"></div><div class="modal-footer"><button type="button" class="button secondary" id="cancel-modal">取消</button><button class="button primary" id="save-modal" type="submit">保存</button></div></form></dialog>
<link rel="stylesheet" href="./mobile.css"><script src="./xlsx.full.min.js"></script><script type="module" src="./app.js"></script></body></html>
